<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>PaperTrail reader checks</title></head>
  <body>
    <div id="root"></div>
    <pre id="startup-error" role="alert" hidden></pre>
    <script type="module">
      import('./main.tsx').catch((error) => {
        const message = document.getElementById('startup-error')
        message.hidden = false
        message.textContent = `Reader startup failed: ${error.name}: ${error.message}\n${error.stack || ''}`
      })
    </script>
  </body>
</html>
